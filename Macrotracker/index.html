<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Macro Tracker</title>

  <!-- Include html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg-colour: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-colour: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-colour);
      color: var(--text-main);
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-colour);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-card p {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-colour);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-colour);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #e0e7ff;
      color: var(--primary);
    }

    /* Camera Scanner Styling */
    #reader {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .log-list {
      list-style: none;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-colour);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .food-info h4 {
      font-size: 0.95rem;
    }

    .food-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <h1>Daily Macro Tracker</h1>

  <!-- Summary Dashboard -->
  <section class="dashboard">
    <div class="stat-card">
      <h3>Calories</h3>
      <p id="total-calories">0</p>
    </div>
    <div class="stat-card">
      <h3>Protein</h3>
      <p id="total-protein">0g</p>
    </div>
    <div class="stat-card">
      <h3>Carbs</h3>
      <p id="total-carbs">0g</p>
    </div>
    <div class="stat-card">
      <h3>Fat</h3>
      <p id="total-fat">0g</p>
    </div>
  </section>

  <!-- Scanner Container -->
  <div id="reader"></div>

  <!-- Manual Entry Form -->
  <section class="card">
    <h2>Log Food Item</h2>
    <form id="food-form" style="margin-top: 12px;">
      <div class="form-group">
        <label for="food-name">Food Name</label>
        <input type="text" id="food-name" placeholder="e.g. Chicken Breast" required>
      </div>

      <div class="input-grid">
        <div class="form-group">
          <label for="calories">Calories (kcal)</label>
          <input type="number" id="calories" placeholder="165" required step="any">
        </div>
        <div class="form-group">
          <label for="protein">Protein (g)</label>
          <input type="number" id="protein" placeholder="31" step="any">
        </div>
        <div class="form-group">
          <label for="carbs">Carbs (g)</label>
          <input type="number" id="carbs" placeholder="0" step="any">
        </div>
        <div class="form-group">
          <label for="fat">Fat (g)</label>
          <input type="number" id="fat" placeholder="3.6" step="any">
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary">Add Entry</button>
        <button type="button" id="scan-btn" class="btn-secondary">Scan Barcode</button>
      </div>
    </form>
  </section>

  <!-- Today's Log -->
  <section class="card">
    <h2>Today's Entries</h2>
    <ul id="log-list" class="log-list"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
